name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    go:
        name: Go
        uses: dz-market/github-actions/.github/workflows/go-ci.yml@v1

    runtime:
        name: Docker runtime
        uses: dz-market/github-actions/.github/workflows/docker-build.yml@v1
        with:
            target: runtime

    migrate:
        name: Docker migrate
        uses: dz-market/github-actions/.github/workflows/docker-build.yml@v1
        with:
            target: migrate