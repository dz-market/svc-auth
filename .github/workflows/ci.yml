name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflows }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    go:
        name: Go
        uses: dz-market/.github/.github/workflows/go-ci.yml@main