name: CD

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    runtime:
        name: Runtime
        uses: dz-market/github-actions/.github/workflows/docker-publish.yml@v1
        with:
            target: runtime

    migrate:
        name: Migrate
        uses: dz-market/github-actions/.github/workflows/docker-publish.yml@v1
        with:
            target: migrate
            suffix: -migrate