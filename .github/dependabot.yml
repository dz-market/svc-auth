version: 2

updates:
    -   package-ecosystem: gomod
        directory: /
        schedule:
            interval: weekly

        groups:
            go-patch-dependencies:
                patterns: ["*"]
                update-types: ["patch"]

            go-minor-dependencies:
                patterns: ["*"]
                update-types: ["minor"]

        commit-message:
            prefix: build
            include: scope