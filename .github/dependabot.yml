version: 2

updates:
    -   package-ecosystem: gomod
        directory: /
        schedule:
            interval: weekly

        groups:
            go-patch:
                patterns: ["*"]
                update-types: ["patch"]

            go-minor:
                patterns: ["*"]
                update-types: ["minor"]

        commit-message:
            prefix: build
            include: scope

    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: weekly

        groups:
            actions-patch:
                patterns: ["*"]
                update-types: ["patch"]

            actions-minor:
                patterns: ["*"]
                update-types: ["minor"]

        commit-message:
            prefix: ci
            include: scope