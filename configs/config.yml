service_name: svc-auth

grpc:
    addr: "${env:GRPC_ADDR}"
    reflection: "${env:GRPC_REFLECTION:-false}"
    max_recv_msg_size: 1MB
    shutdown_timeout: 10s
    keepalive:
        max_connection_age: 30m
        max_connection_age_grace: 10m

auth:
    access:
        ttl: 15m
        issuer: svc-auth
        audience: [marketplace]
        private_key: "${vault:transit/export/signing-key/access-token#keys.1}"
    refresh:
        length: 32
    session:
        ttl: 720h
    password:
        argon2id:
            memory: 19MB
            iterations: 2
            parallelism: 1
            salt_length: 16
            key_length: 32
            max_in_flight: 8

postgres:
    dsn: "${env:POSTGRES_DSN}"
    max_conns: 10
    min_conns: 2
    max_conn_lifetime: 1h
    max_conn_idle_time: 30m
    health_check_period: 1m
    connect_timeout: 5s
    ping_timeout: 2s

kafka:
    brokers: ["${env:KAFKA_BROKERS}"]
    delivery_timeout: 5s
    log_level: error

outbox:
    poll_interval: 1s
    batch_size: 100
    batch_timeout: 10s
    max_attempts: 10
    publisher_recovery:
        check_timeout: 2s
        initial_backoff: 5s
        max_backoff: 1m

health:
    period: 5s
    timeout: 2s

log:
    level: info
    format: text