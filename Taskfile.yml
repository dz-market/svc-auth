version: "3"

dotenv:
    - .env

vars:
    MIGRATIONS_DIR: migrations

tasks:
    lint:
        desc: Run golangci-lint
        cmds:
            - golangci-lint run

    lint:fix:
        desc: Run golangci-lint with autofix
        cmds:
            - golangci-lint run --fix

    fmt:
        desc: Apply formatters
        cmds:
            - golangci-lint fmt

    fix:
        desc: Rewrite code that uses outdated Go APIs
        cmds:
            - go fix ./...

    mocks:
        desc: Generate mocks
        cmds:
            - go tool mockery

    migrate:create:
        desc: "Create a migration: task migrate:create -- init"
        cmds:
            - mkdir -p {{.MIGRATIONS_DIR}}
            - goose -dir {{.MIGRATIONS_DIR}} create {{.CLI_ARGS}} sql

    migrate:status:
        desc: Show migration status
        cmds:
            - goose -dir {{.MIGRATIONS_DIR}} postgres "$POSTGRES_DSN" status

    migrate:up:
        desc: Apply migrations
        cmds:
            - goose -dir {{.MIGRATIONS_DIR}} postgres "$POSTGRES_DSN" up

    migrate:down:
        desc: Roll back last migration
        cmds:
            - goose -dir {{.MIGRATIONS_DIR}} postgres "$POSTGRES_DSN" down

    keys:
        desc: Generate RSA keypair for signing access tokens (RS256)
        status:
            - test -f .keys/access.key
        cmds:
            - mkdir -p .keys
            - openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out .keys/access.key
            - chmod 600 .keys/access.key
            - openssl pkey -in .keys/access.key -pubout -out .keys/access.pub