version: "3"

tasks:
    lint:
        desc: Run golangci-lint
        cmds:
            - golangci-lint run

    lint:fix:
        desc: Run golangci-lint with autofix
        cmds:
            - golangci-lint run --fix

    fmt:
        desc: Apply formatters
        cmds:
            - golangci-lint fmt

    fix:
        desc: Rewrite code that uses outdated Go APIs
        cmds:
            - go fix ./...